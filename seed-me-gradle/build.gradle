apply plugin: 'com.gradle.plugin-publish'
apply plugin: 'groovy'
apply plugin: 'java-library'

group = 'cloud.wondrify'

ext {
    pomDescription = 'JVM Seed Me Gradle Adapter.'
    pomMavenPublicationName = 'pluginMaven'
}

gradlePlugin {
    website = 'https://github.com/wondrify/seed-me'
    vcsUrl = 'https://github.com/wondrify/seed-me'
    plugins {
        seedMePlugin {
            id = 'cloud.wondrify.seed-me'
            displayName = 'Seed Me Gradle Plugin'
            description = 'Gradle plugin for compiling seed data into Grails applications.'
            implementationClass = 'seedme.gradle.SeedMePlugin'
            tags.set(['grails', 'seed', 'data', 'groovy'])
        }
    }
}

dependencies {
    implementation gradleApi()

}




apply {
    from rootProject.layout.projectDirectory.file('gradle/java-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/publish-config.gradle')
}